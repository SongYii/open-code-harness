name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly. The soak and citation lanes need time and network, so they run
    # here rather than on the pull-request path.
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/acp-web-bridge/web/package-lock.json
      - name: Build web bridge frontend
        working-directory: cmd/acp-web-bridge/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Architecture surface guard
        run: go test ./internal/harness/architecture -count=1
      - name: Digest and fixture gates
        run: go test ./internal/harness/application ./internal/harness/domain -run 'TestDigest|TestRecordedEvent|TestReplay|TestCompact' -count=1
      - name: Test with race detector
        run: go test -race ./... -count=1

  # SECURITY.md's central claim is that a model-proposed `exec` command
  # cannot write outside the workspace, reach the network, or see host
  # processes. The only executable evidence for it is the bwrap-backed
  # confinement suite, and until this job existed nothing ever ran that
  # suite: `ubuntu-latest` ships no bubblewrap, so all three tests skipped
  # on every run while the job still reported green. The `go` job above is
  # deliberately left without a backend — that configuration is the one
  # that covers the unsandboxed escape hatch — so the two lanes together
  # cover both halves rather than one of them twice.
  #
  # OCH_REQUIRE_EXEC_SANDBOX is what makes this job honest: without it, a
  # backend that is installed but blocked (recent Ubuntu restricts
  # unprivileged user namespaces through AppArmor) would skip exactly as
  # before and this job would go green having verified nothing.
  #
  # Scope, stated rather than implied: this proves filesystem and network
  # confinement. The cgroup v2 memory and CPU quota tests have a separate
  # environment constraint (a functionally delegated controller, which the
  # "no internal process" rule denies on many hosts) and still skip under
  # their own guards. No quota claim is verified here.
  exec-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the exec sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Best effort: if this host restricts unprivileged user
          # namespaces, lift the restriction. A failure here is not fatal
          # on its own -- the test-side requirement below is what decides
          # whether the backend actually works.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Exec confinement suite, backend required
        env:
          OCH_REQUIRE_EXEC_SANDBOX: "1"
        run: go test -race ./internal/harness/adapters/localexec -count=1 -v

  # The race detector requires cgo, so the primary job cannot cover the
  # `!unix` build tag. These targets are built and vetted, not tested: no
  # platform beyond Linux is claimed to be supported.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/acp-web-bridge/web/package-lock.json
      - name: Build web bridge frontend
        working-directory: cmd/acp-web-bridge/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
        run: go build ./...
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependency graph is unchanged
        run: |
          go mod tidy -diff
          git diff --exit-code go.mod go.sum
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A single green run samples the suite once. Two flaky tests reached main
  # that way and turned documentation-only pull requests red: a heartbeat test
  # that sampled state on an exact tick boundary, and twelve wall-clock
  # rendezvous guards that lost races under -race with packages in parallel.
  # Neither reproduced reliably in one run of one package, so this repeats the
  # whole suite. It runs beside the `go` job and adds no wall-clock time to it.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/acp-web-bridge/web/package-lock.json
      - name: Build web bridge frontend
        working-directory: cmd/acp-web-bridge/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat the race suite
        run: go test -race ./... -count=3

  # The full Context mechanism matrix: nine EvalSets, five of them driving real
  # `och -acp` subprocesses, measured at 64s under the race detector. It is
  # opt-in by name so no other lane can pick it up by accident — the `go` job
  # would run it on every pull request and `determinism` three more times, and
  # an end-to-end subprocess matrix is not a flakiness sample. Focused and
  # exactly once: `soak`'s -count=10 must never reach it either.
  #
  # cmd/och-eval and cmd/och do not embed the web bridge bundle, so this job
  # needs no npm step.
  context-matrix:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the full Context mechanism matrix
        env:
          OCH_EVAL_SCHEDULED_CONTEXT_MATRIX: "1"
        run: go test -race ./cmd/och-eval -run '^TestContextScheduledLane' -count=1

  # Deeper repetition and the network-dependent citation gate. Nightly only.
  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/acp-web-bridge/web/package-lock.json
      - name: Build web bridge frontend
        working-directory: cmd/acp-web-bridge/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Soak the race suite
        run: go test -race ./... -count=10 -timeout 40m
      - name: Check external citations resolve
        env:
          DOCSGUARD_CHECK_EXTERNAL_LINKS: "1"
        run: go test ./internal/docsguard -run TestExternalCitations -count=1 -v
